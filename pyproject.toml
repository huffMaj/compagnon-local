[project]
name = "mon-compagnon"
version = "0.1.0"
description = "Assistant IA agentique 100 % local (llama.cpp, streaming, outils, interface Qt)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.28",
    "loguru>=0.7",
    "platformdirs>=4.2",
    "PySide6>=6.7",
]

[project.scripts]
mon-compagnon = "mon_compagnon.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mon_compagnon"]
